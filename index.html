  <style>

    display:flex;
    gap:20px;
    width:100%;
    max-width:1100px;
  }
  .conv-wrap{ flex-wrap:wrap; }

  /* Wrapper больше не нужен для positioning subscript */
  .input-wrapper{
    width:100%;
  }

  /* Базовые стили для editable div (имитация input) */
  .editable-input{
    padding:14px; 
    font-size:18px; 
    border:1px solid #ddd; 
    border-radius:8px; 
    width:100%;
    min-height:50px;  /* чтобы не схлопывался */
    background:#fff;
    cursor:text;
    white-space:pre-wrap;  /* сохраняем пробелы */
    overflow-wrap:break-word;
    font-family:Arial, sans-serif;
    color:#222;
    outline:none;
    transition:border-color .2s;
  }

  .editable-input:focus{
    border-color:#e67e22;
  }

  .editable-input.error{
    border-color:#e74c3c;
    background:#fdecea;
  }

  /* Placeholder через псевдоэлемент */
  .editable-input:empty::before{
    content:attr(data-placeholder);
    color:#ccc;
    pointer-events:none;
  }

  /* Subscripts внутри editable */
  .editable-input sub{
    font-size:12px;
    color:#ccc;
    user-select:none;  /* не копируется */
    pointer-events:none;
    margin-left:1px;
    vertical-align:sub;
    line-height:0;
  }

  /* Убираем старые стили для input */
  /* .conv-field input { ... } — удалить или закомментировать */

  .info-tip{
    position:relative;
    display:inline-block;
    width:14px; height:14px;
    font-size:11px; line-height:14px; text-align:center;
    color:#bbb; border:1px solid #ddd; border-radius:50%;
    cursor:help; margin-left:4px;
    transition:color .2s, border-color .2s;
  }
  .info-tip:hover{ color:#e67e22; border-color:#e67e22; }

  /* Кастомный tooltip */
  .info-tip::after{
    content:attr(data-tooltip);
    position:absolute;
    bottom:120%; left:50%;
    transform:translateX(-50%) translateY(-4px);
    background:#1f2421; color:#f7f4ef;
    font-size:11px; font-weight:normal;
    white-space:nowrap;
    padding:6px 10px; border-radius:6px;
    opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s;
    z-index:10;
  }
  .info-tip::before{
    /* стрелочка вниз */
    content:'';
    position:absolute;
    bottom:100%; left:50%;
    transform:translateX(-50%);
    border:5px solid transparent;
    border-top-color:#1f2421;
    opacity:0;
    transition:opacity .25s;
  }
  .info-tip:hover::after, .info-tip:hover::before{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  /* ===== HISTORY header + clear button ===== */
  .history{ width:100%; max-width:1100px; margin-top:36px; }
  .history-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
    padding-left:2px;
  }
  .history-title{
    font-size:13px; color:#aaa; text-transform:uppercase;
    letter-spacing:1px; margin:0;
  }

  .clear-btn{
    font-family:Arial, sans-serif;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.5px;
    color:#e67e22;
    background:transparent;
    border:1px solid #f0c088;
    border-radius:6px;
    padding:5px 12px;
    cursor:pointer;
    transition:opacity .3s ease, transform .3s ease, background .2s ease, color .2s ease;

    opacity:0;
    transform:translateY(-4px) scale(.96);
    pointer-events:none;
  }

  .clear-btn.visible{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
  }
  .clear-btn:hover{ background:#e67e22; color:#fff; }
  .clear-btn:active{ transform:scale(.94); }

  /* ===== Collapsible / scrollable history ===== */
  .history-scroll{
    overflow-y:auto;
    border-radius:8px;
    max-height:var(--history-max, 80vh);
    position:relative;
  }
  .history-scroll::-webkit-scrollbar{ width:8px; }
  .history-scroll::-webkit-scrollbar-thumb{

  }
  .history-scroll::-webkit-scrollbar-thumb:hover{ background:#ccc; }

  .scroll-top-btn{
    position:sticky;
    top:8px;
    float:right;
    margin-right:8px;
    z-index:5;

    font-family:Arial, sans-serif;
    font-size:12px;
    letter-spacing:.5px;
    text-transform:uppercase;

    color:#fff;
    background:rgba(230,126,34,0.65);
    border:1px solid rgba(230,126,34,0.4);
    border-radius:20px;
    padding:6px 14px;
    cursor:pointer;
    backdrop-filter:blur(3px);

    transition:opacity .3s ease, transform .3s ease, background .2s ease;

    opacity:0;
    transform:translateY(-6px);
    pointer-events:none;
  }
  .scroll-top-btn.visible{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
  }
  .scroll-top-btn:hover{ background:rgba(230,126,34,0.9); }
  .scroll-top-btn:active{ transform:scale(.95); }

  .history-list{
    display:flex; flex-direction:column; gap:8px;
    padding-right:2px;
  }

  .history-row{
    opacity:0;
    transform:translateY(-8px);
    animation:fadeInDown .4s ease forwards;
  }
  @keyframes fadeInDown{ to{ opacity:1; transform:translateY(0); } }

  .history-cell{
    flex:1;
    min-width:200px;
    background:#fbfbfb;
    border:1px solid #eee;
    border-radius:8px;

    /* Скрыть subscript, когда поле пустое (показываем placeholder) */

  .feedback-email:hover{ background:#fff8f0; }
  .feedback-or{ font-size:11px; color:#ccc; }

  .feedback-toggle form{ display:flex; flex-direction:column; gap:8px; }
  .feedback-toggle label{
    font-size:12px; color:#666; display:flex; flex-direction:column; gap:4px;
  }
  .feedback-toggle input, .feedback-toggle textarea{
    padding:8px; border:1px solid #ddd; border-radius:6px; font-size:13px;
    font-family:Arial,sans-serif;
  }
  .feedback-toggle button{
    align-self:flex-start;
    padding:7px 16px; background:#e67e22; color:#fff; border:none;
    border-radius:6px; cursor:pointer; font-size:12px; text-transform:uppercase;

  @media (max-width: 640px){
    .feedback-fixed{
      bottom:12px; right:12px; left:12px;
      max-width:none;
    }
  }
  ::placeholder{
    color:#ccc;
    opacity:1; /* Firefox по умолчанию делает placeholder полупрозрачным */
  }
</style>

<body>
  <div class="header">
    <h1>simple<span class="accent">HEX</span></h1>
    <p>simple HEX / binary converter</p>
  </div>

  <div class="conv-wrap">
    <!-- Decimal -->
    <div class="conv-field">
      <label>Decimal <span class="info-tip" data-tooltip="Supports expressions: (10 + 5) * 2">?</span></label>
      <div class="input-wrapper">
        <div class="editable-input" 
            id="dec" 
            contenteditable="true" 
            data-name="DEC" 
            data-base="10"
            data-placeholder="255"
            spellcheck="false"></div>
      </div>
    </div>

    <!-- Binary -->
    <div class="conv-field">
      <label>Binary <span class="info-tip" data-tooltip="Use 0b prefix: 0b1010 + 1">?</span></label>
      <div class="input-wrapper">
        <div class="editable-input" 
            id="bin" 
            contenteditable="true" 
            data-name="BIN" 
            data-base="2"
            data-placeholder="1010"
            spellcheck="false"></div>
      </div>
    </div>

    <!-- Hex -->
    <div class="conv-field">
      <label>Hex <span class="info-tip" data-tooltip="Use 0x prefix: 0xFF + 0x1">?</span></label>
      <div class="input-wrapper">
        <div class="editable-input" 
            id="hex" 
            contenteditable="true" 
            data-name="HEX" 
            data-base="16"
            data-placeholder="FF"
            spellcheck="false"></div>
      </div>
    </div>

    <!-- Custom -->
    <div class="conv-field">
      <label>Custom (base)</label>
      <div class="conv-custom">
        <input type="number" id="base" min="2" max="36" value="8" title="Base">
        <div class="input-wrapper">
          <div class="editable-input" 
              id="cust" 
              contenteditable="true" 
              data-name="CUSTOM"
              data-placeholder="77"
              spellcheck="false"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="history">
    <div class="history-header">
      <div class="history-title">HISTORY</div>
      <button type="button" id="clearHistory" class="clear-btn" aria-label="clear history">clear history</button>
    </div>

    <div class="history-scroll" id="historyScroll">
      <button type="button" id="scrollTopBtn" class="scroll-top-btn" aria-label="scroll to top of history"> ↑ top </button>
      <div class="history-list" id="historyList">
        <div class="history-empty" id="historyEmpty">Here will appear your calculations...</div>
      </div>
    </div>
  </div>

  <div class="feedback-fixed">
    <details class="feedback-toggle">
      <summary>Feedback / Report Issue</summary>
        <div class="feedback-content">
          <p class="feedback-options">
            <a href="mailto:your-alias@domain.com" class="feedback-email">📧 Email</a>
            <span class="feedback-or">or</span>
          </p>
          <form name="feedback" method="POST" data-netlify="true" netlify-honeypot="bot-field">
            <input type="hidden" name="form-name" value="feedback">
            <p style="display:none;">
              <label>Don't fill this out if you're human: <input name="bot-field"></label>
            </p>

            <label>
              Your email (optional):
              <input type="email" name="email" placeholder="your@email.com">
            </label>

            <label>
              Message:
              <textarea name="message" rows="4" placeholder="Bug report, feature request, or feedback..." required></textarea>
            </label>

            <button type="submit">Send</button>
          </form>
        </div>
      </details>
    </div>

<script>
  (function(){
    var dec  = document.getElementById('dec');
    var bin  = document.getElementById('bin');
    var hex  = document.getElementById('hex');
    var cust = document.getElementById('cust');
    var base = document.getElementById('base');

    var historyList  = document.getElementById('historyList');
    var historyEmpty = document.getElementById('historyEmpty');
    var historyScroll = document.getElementById('historyScroll');
    var clearBtn      = document.getElementById('clearHistory');

    var STORAGE_KEY = 'simplehex_history';
    var MAX_STORED = 50;

    function saveHistoryToStorage(){
      var rows = historyList.querySelectorAll('.history-row');
      var data = [];
      rows.forEach(function(row){
        var cells = row.querySelectorAll('.history-cell');
        if (cells.length === 4){
          data.push({
            dec: cells[0].querySelector('.cell-val').textContent,
            bin: cells[1].querySelector('.cell-val').textContent,
            hex: cells[2].querySelector('.cell-val').textContent,
            cust: cells[3].querySelector('.cell-val').textContent,
            custBase: cells[3].querySelector('.cell-label').textContent,
            source: row.querySelector('.history-cell.source') 
              ? Array.from(cells).indexOf(row.querySelector('.history-cell.source')) 
              : 0
          });
        }
      });
      if (data.length > MAX_STORED) data = data.slice(0, MAX_STORED);
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch(e){ /* quota exceeded — ignored */ }
    }

    function loadHistoryFromStorage(){
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        var data = JSON.parse(raw);
        if (!Array.isArray(data)) return;

        // Delete placeholder
        if (historyEmpty){ historyEmpty.remove(); historyEmpty = null; }

        data.forEach(function(item){
          var row = document.createElement('div');
          row.className = 'history-row';

          row.appendChild(makeCell('DEC', item.dec, item.source === 0));
          row.appendChild(makeCell('BIN', item.bin, item.source === 1));
          row.appendChild(makeCell('HEX', item.hex, item.source === 2));
          row.appendChild(makeCell(item.custBase, item.cust, item.source === 3));

          historyList.appendChild(row);
        });

        updateClearBtn();
        recalcHistoryHeight();
      } catch(e){ /* JSON parse error — ignored */ }
    }

    // ===== ContentEditable helpers =====

    function toSubscript(num){
      return num.toString().split('').map(function(d){
        return '₀₁₂₃₄₅₆₇₈₉'[d];
      }).join('');
    }

    // Получить чистый текст из contenteditable (без HTML)
    function getPlainText(el){
      var text = el.textContent || '';
      return text.replace(/\u200B/g, ''); // убираем zero-width space
    }

    // Сохранить позицию курсора (offset от начала текста)
    function saveCursorPosition(el){
      var sel = window.getSelection();
      if (!sel.rangeCount) return 0;
      var range = sel.getRangeAt(0);
      var preCaretRange = range.cloneRange();
      preCaretRange.selectNodeContents(el);
      preCaretRange.setEnd(range.endContainer, range.endOffset);
      return preCaretRange.toString().length;
    }

    // Восстановить позицию курсора
    function restoreCursorPosition(el, offset){
      var sel = window.getSelection();
      var range = document.createRange();
      var charIndex = 0;
      var nodeStack = [el];
      var node, foundStart = false;

      while (!foundStart && (node = nodeStack.pop())){
        if (node.nodeType === Node.TEXT_NODE){
          var nextCharIndex = charIndex + node.length;
          if (offset >= charIndex && offset <= nextCharIndex){
            range.setStart(node, offset - charIndex);
            range.collapse(true);
            foundStart = true;
          }
          charIndex = nextCharIndex;
        } else {
          var children = node.childNodes;
          for (var i = children.length - 1; i >= 0; i--){
            nodeStack.push(children[i]);
          }
        }
      }

      if (!foundStart){
        // Если offset за пределами — ставим в конец
        range.selectNodeContents(el);
        range.collapse(false);
      }

      sel.removeAllRanges();
      sel.addRange(range);
    }

    // Парсинг текста и добавление subscripts
    function renderWithSubscripts(el, baseRadix){
      var cursorPos = saveCursorPosition(el);
      var text = getPlainText(el);

      if (text.trim() === ''){
        el.textContent = '';
        return text;
      }

      var tokens = tokenizeExpression(text);
      var html = '';

      tokens.forEach(function(token){
        if (token.type === 'number'){
          var subscript = toSubscript(token.base);
          // Экранируем текст
          var escaped = escapeHtml(token.text);
          html += escaped + '<sub>' + subscript + '</sub>';
        } else {
          html += escapeHtml(token.text);
        }
      });

      el.innerHTML = html;
      restoreCursorPosition(el, cursorPos);
      return text;
    }

    // Токенизация выражения (определение чисел и их оснований)
    function tokenizeExpression(text){
      var tokens = [];
      var i = 0;

      while (i < text.length){
        var ch = text[i];

        // Операторы и пробелы
        if (/[\s+\-*/()]/.test(ch)){
          tokens.push({type:'operator', text:ch});
          i++;
          continue;
        }

        // Число
        var numStart = i;
        var detectedBase = null;

        // Префикс 0x
        if (text[i] === '0' && (text[i+1] === 'x' || text[i+1] === 'X')){
          detectedBase = 16;
          i += 2;
          while (i < text.length && /[0-9a-fA-F]/.test(text[i])) i++;
        }
        // Префикс 0b
        else if (text[i] === '0' && (text[i+1] === 'b' || text[i+1] === 'B')){
          detectedBase = 2;
          i += 2;
          while (i < text.length && /[01]/.test(text[i])) i++;
        }
        // Голое число (hex, decimal, или смешанное)
        else {
          // Читаем все alphanumeric
          while (i < text.length && /[0-9a-zA-Z]/.test(text[i])) i++;
          var numText = text.slice(numStart, i);

          // Попробуем определить основание по содержимому
          if (/^[01]+$/.test(numText)){
            detectedBase = 2; // может быть binary
          } else if (/^[0-9a-fA-F]+$/.test(numText)){
            // Может быть hex или decimal
            if (/[a-fA-F]/.test(numText)){
              detectedBase = 16; // точно hex
            } else {
              detectedBase = 10; // скорее всего decimal
            }
          } else {
            detectedBase = 10; // по умолчанию
          }
        }

        var numText = text.slice(numStart, i);
        tokens.push({type:'number', text:numText, base:detectedBase});
      }

      return tokens;
    }

    // Placeholder examples
    var placeholders = {
      dec: ['255', '(10 + 5) * 2', '1024 / 8', '0xFF'],
      bin: ['1010', '0b1111 + 1', '0b1000 * 2'],
      hex: ['FF', '0xFF + 0x1', '0xDEADBEEF', 'A * 10'],
      cust: ['77', '10 + 7', '0xFF']
    };

    function setRandomPlaceholders(){
      ['dec','bin','hex','cust'].forEach(function(id){
        var el = document.getElementById(id);
        var examples = placeholders[id];
        var placeholder = examples[Math.floor(Math.random() * examples.length)];
        el.setAttribute('data-placeholder', placeholder);
      });
    }

    // Установить при загрузке
    setRandomPlaceholders();

    // Обновлять placeholder при очистке поля
    [dec,bin,hex,cust].forEach(function(el){
      el.addEventListener('input', function(){
        if (el.value === '') setRandomPlaceholders();
      });
    });

    function clearErrors(){
      [dec,bin,hex,cust].forEach(function(el){ el.classList.remove('error'); });
    }

    function getBase(){
      var b = parseInt(base.value, 10);
      if (isNaN(b) || b < 2 || b > 36) b = 8;
      return b;
    }

    var DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz';

    function bigToString(value, radix){
      var neg = value < 0n;
      var v = neg ? -value : value;
      var r = BigInt(radix);
      if (v === 0n) return '0';
      var out = '';
      while (v > 0n){
        out = DIGITS[Number(v % r)] + out;
        v = v / r;
      }
      return (neg ? '-' : '') + out;
    }

    function parseBig(str, radix){
      var r = BigInt(radix);
      var neg = false;
      str = str.toLowerCase();
      if (str[0] === '-'){ neg = true; str = str.slice(1); }
      if (str === '') return null;
      var acc = 0n;
      for (var i=0;i<str.length;i++){
        var d = DIGITS.indexOf(str[i]);
        if (d === -1 || d >= radix) return null;
        acc = acc * r + BigInt(d);
      }
      return neg ? -acc : acc;
    }

    // ===== commit status tables =====
    var timers = {};
    var lastCommitted = {};   // BigInt, last entered value
    var lastRaw = {};         // string, last string on the field

    // radix for each field
    function radixOf(el){
      if (el === dec) return 10;
      if (el === bin) return 2;
      if (el === hex) return 16;
      if (el === cust) return getBase();
      return 10;
    }

    function markCommitted(el, value){
      lastCommitted[el.id] = value;
      lastRaw[el.id] = el.value;
    }

    function updateAll(value, except){
      var b = getBase();
      
      if (except !== dec){
        dec.textContent = bigToString(value, 10);
        renderWithSubscripts(dec, 10);
      }
      if (except !== bin){
        bin.textContent = bigToString(value, 2);
        renderWithSubscripts(bin, 2);
      }
      if (except !== hex){
        hex.textContent = bigToString(value, 16).toUpperCase();
        renderWithSubscripts(hex, 16);
      }
      if (except !== cust){
        cust.textContent = bigToString(value, b).toUpperCase();
        renderWithSubscripts(cust, b);
      }

      [dec,bin,hex,cust].forEach(function(f){
        if (f !== except) markCommitted(f, value);
      });
    }

    function evalExpr(raw, radix){
      var s = raw.replace(/\s+/g, '');
      if (s === '') return null;
      var tokens = [];
      var i = 0;
      while (i < s.length){
        var ch = s[i];
        if ('+-*/()'.indexOf(ch) !== -1){ tokens.push(ch); i++; continue; }
        var localRadix = radix;
        if (s[i] === '0' && (s[i+1]==='x'||s[i+1]==='X')){ localRadix=16; i+=2; }
        else if (s[i] === '0' && (s[i+1]==='b'||s[i+1]==='B')){ localRadix=2; i+=2; }
        var valid = DIGITS.slice(0, localRadix);
        var numStr = '';
        while (i < s.length && valid.indexOf(s[i].toLowerCase()) !== -1){ numStr += s[i]; i++; }
        if (numStr === '') return NaN;
        var v = parseBig(numStr, localRadix);
        if (v === null) return NaN;
        tokens.push(v);
      }
      try { return parseExpr(tokens, {pos:0}); }
      catch(e){ return NaN; }
    }

    function parseExpr(tokens, st){
      var value = parseTerm(tokens, st);
      while (st.pos < tokens.length && (tokens[st.pos]==='+' || tokens[st.pos]==='-')){
        var op = tokens[st.pos++];
        var rhs = parseTerm(tokens, st);
        value = (op === '+') ? value + rhs : value - rhs;
      }
      return value;
    }
    function parseTerm(tokens, st){
      var value = parseFactor(tokens, st);
      while (st.pos < tokens.length && (tokens[st.pos]==='*' || tokens[st.pos]==='/')){
        var op = tokens[st.pos++];
        var rhs = parseFactor(tokens, st);
        if (op === '*') value = value * rhs;
        else { if (rhs === 0n) throw new Error('div0'); value = value / rhs; }
      }
      return value;
    }
    function parseFactor(tokens, st){
      var t = tokens[st.pos];
      if (t === '+'){ st.pos++; return parseFactor(tokens, st); }
      if (t === '-'){ st.pos++; return -parseFactor(tokens, st); }
      if (t === '('){
        st.pos++;
        var v = parseExpr(tokens, st);
        if (tokens[st.pos] !== ')') throw new Error('paren');
        st.pos++;
        return v;
      }
      if (typeof t === 'bigint'){ st.pos++; return t; }
      throw new Error('unexpected');
    }

    // ===== History =====
    function makeCell(labelText, valueText, isSource){
      var cell = document.createElement('div');
      cell.className = 'history-cell' + (isSource ? ' source' : '');
      cell.innerHTML =
        '<span class="cell-label">' + escapeHtml(labelText) + '</span>' +
        '<span class="cell-val">' + escapeHtml(valueText) + '</span>';
      return cell;
    }

    function addHistory(sourceEl, rawInput, value){
      if (historyEmpty){ historyEmpty.remove(); historyEmpty = null; }
      var b = getBase();
      var row = document.createElement('div');
      row.className = 'history-row';

      var srcIsDec  = (sourceEl === dec);
      var srcIsBin  = (sourceEl === bin);
      var srcIsHex  = (sourceEl === hex);
      var srcIsCust = (sourceEl === cust);

      row.appendChild(makeCell('DEC',
        srcIsDec ? rawInput.trim() : bigToString(value,10), srcIsDec));
      row.appendChild(makeCell('BIN',
        srcIsBin ? rawInput.trim() : bigToString(value,2), srcIsBin));
      row.appendChild(makeCell('HEX',
        srcIsHex ? rawInput.trim() : bigToString(value,16).toUpperCase(), srcIsHex));
      row.appendChild(makeCell('base ' + b,
        srcIsCust ? rawInput.trim() : bigToString(value,b).toUpperCase(), srcIsCust));

      historyList.insertBefore(row, historyList.firstChild);
      updateClearBtn();
      recalcHistoryHeight();

      saveHistoryToStorage();
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }

    function updateClearBtn(){
      // visible only then there are at least 1 record
      var hasRows = historyList.querySelector('.history-row') !== null;
      clearBtn.classList.toggle('visible', hasRows);
    }

    var scrollTopBtn = document.getElementById('scrollTopBtn');

    function updateScrollTopBtn(){
      scrollTopBtn.classList.toggle('visible', historyScroll.scrollTop > 40);
    }

    historyScroll.addEventListener('scroll', updateScrollTopBtn);

    scrollTopBtn.addEventListener('click', function(){
      historyScroll.scrollTo({ top:0, behavior:'smooth' });
    });

    // ===== commit record =====
    function tryCommit(el){
      var raw = getPlainText(el);
      if (raw.trim() === '') return;
      
      var r = radixOf(el);
      if (el === cust && (r < 2 || r > 36)) return;

      var value = evalExpr(raw, r);
      if (typeof value !== 'bigint') return;

      var key = el.id;
      if (lastCommitted[key] === value && lastRaw[key] === raw) return;

      addHistory(el, raw, value);
      [dec,bin,hex,cust].forEach(function(f){ markCommitted(f, value); });
    }

    function handle(el){
      return function(){
        clearErrors();
        
        // Рендерим с subscripts и получаем чистый текст
        var baseRadix = radixOf(el);
        var raw = renderWithSubscripts(el, baseRadix);

        if (raw.trim() === ''){
          [dec,bin,hex,cust].forEach(function(f){ 
            if(f !== el) f.textContent = ''; 
          });
          resetTimer(el);
          return;
        }

        var r = baseRadix;
        if (el === cust && (r < 2 || r > 36)){ 
          el.classList.add('error'); 
          return; 
        }

        var value = evalExpr(raw, r);
        if (value === null) return;
        if (typeof value !== 'bigint'){ 
          el.classList.add('error'); 
          return; 
        }

        updateAll(value, el);
        resetTimer(el);
      };
    }

    function resetTimer(el){
      var key = el.id;
      if (timers[key]) clearTimeout(timers[key]);
      timers[key] = setTimeout(function(){ tryCommit(el); }, 5000);
    }

    function bindField(el){
      el.addEventListener('input', handle(el));

      el.addEventListener('blur', function(){
        if (timers[el.id]) clearTimeout(timers[el.id]);
        tryCommit(el);
      });

      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter'){
          e.preventDefault();
          el.blur();
        }
      });

      el.addEventListener('paste', function(e){
        e.preventDefault();
        var text = (e.clipboardData || window.clipboardData).getData('text/plain');
        document.execCommand('insertText', false, text);
      });
    }

    bindField(dec);
    bindField(bin);
    bindField(hex);
    bindField(cust);

    [dec,bin,hex,cust].forEach(function(el){
      el.addEventListener('copy', function(e){
        e.preventDefault();
        var text = getPlainText(el);
        e.clipboardData.setData('text/plain', text);
      });
    });

    base.addEventListener('input', function(){
      var b = getBase();
      
      if (dec.textContent.trim() !== ''){
        var v = evalExpr(getPlainText(dec), 10);
        if (typeof v === 'bigint') updateAll(v, null);
      }
    });

    clearBtn.addEventListener('click', function(){
      clearBtn.classList.remove('visible');
      scrollTopBtn.classList.remove('visible');

      var rows = historyList.querySelectorAll('.history-row');
      rows.forEach(function(r){ r.remove(); });

      if (!historyEmpty){
        historyEmpty = document.createElement('div');
        historyEmpty.className = 'history-empty';
        historyEmpty.id = 'historyEmpty';
        historyEmpty.textContent = 'Here will appear your calculations...';
        historyList.insertBefore(row, historyList.firstChild);
      }

      lastCommitted = {};
      lastRaw = {};
      recalcHistoryHeight();

      localStorage.removeItem(STORAGE_KEY);
    });

    var BOTTOM_GAP_VH = 0.20;
    var MOBILE_BP = 640;

    function recalcHistoryHeight(){
      var winH = window.innerHeight;
      var topOffset = historyScroll.getBoundingClientRect().top;
      var gap = winH * BOTTOM_GAP_VH;

      var isMobile = window.innerWidth <= MOBILE_BP;
      if (isMobile) gap = winH * 0.10;

      var maxH = winH - topOffset - gap;
      if (maxH < 120) maxH = 120;

      historyScroll.style.setProperty('--history-max', maxH + 'px');
    }

    window.addEventListener('resize', recalcHistoryHeight);
    window.addEventListener('load', recalcHistoryHeight);
    recalcHistoryHeight();

    // Examples
    document.querySelectorAll('.example-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var fieldName = btn.dataset.field;
        var value = btn.dataset.value;
        var el = document.getElementById(fieldName);
        el.value = value;
        el.focus();
        el.dispatchEvent(new Event('input', {bubbles:true}));
      });
    });

    loadHistoryFromStorage();

  })();
</script>
</body>
</html>
